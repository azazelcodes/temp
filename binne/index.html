<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <title>biͯnne</title>
        <base href="http://localhost:8000/" />
        <link rel="icon" href="assets/logo.svg" />
        <style>
            body {
                margin: 0;
                padding: 0;
                background-color: #000a12;
                overflow: hidden;
            }

            input[type="file"] {
                display: none;
            }

            label {
                display: inline-block;
            }

            #embedded {
                height: 100vh;
                width: 100vw;
            }

            #setters {
                display: flex;
                flex-wrap: wrap;
                justify-content: space-evenly;
            }

            #setters > div {
                display: inline-block;
                background-color: #000a12;
                color: white;
                cursor: pointer;
                margin: 5px;
                border-radius: 1vw;
                text-align: center;
                width: 4vw;
                height: 4vw;
                padding: 1vw 1vw;
            }

            #setters img {
                width: 100%;
                height: 100%;
                object-fit: contain;
            }

            #button {
                position: absolute;
                display: flex;
                flex-direction: column;
                align-items: center;
                height: 4vh;
                z-index: 9;
                cursor: pointer;
            }

            #hover {
                border-radius: 0 0 1vw 1vw;
                background: black;
                width: 5vw;
                height: 2.5vw;
                box-shadow:
                    inset 0.1vw 0 0 0 white,
                    inset -0.1vw 0 0 0 white,
                    inset 0 -0.1vw 0 0 white;
                opacity: 0.16;
                display: inline-block;
                pointer-events: auto;
            }

            #modal {
                display: none;
                position: fixed;
                z-index: 99;
                left: 0;
                top: 0;
                width: 100vw;
                height: 100vh;
                background-color: rgb(0, 0, 0);
                background-color: rgba(0, 0, 0, 0.33);
                overflow: auto;
            }

            #modal-content {
                background-color: #001f3f;
                margin: 15% auto;
                width: 66%;
                padding: 0.75vw;
                border-radius: 1vw;
            }
        </style>
    </head>
    <body>
        <img id="button" src="assets/picker.svg" onclick="openModal()" />

        <div id="modal">
            <div id="modal-content">
                <div id="setters"></div>
            </div>
        </div>

        <object>
            <embed id="embedded" src="" />
        </object>

        <script>
            async function loadGames() {
                const list = document.getElementById("setters");
                const files = await (await fetch("/games/")).json();
                for (let i = 0; i < files.length; i++) {
                    const fileName = files[i].name;

                    const game = document.createElement("div");
                    game.title = fileName;
                    game.onclick = function () {
                        getGame(this);
                    };

                    let cover = "assets/logo.svg";
                    if (
                        files[i].type.startsWith("image/") ||
                        files[i].type.startsWith("application/") ||
                        files[i].type.startsWith("audio/") ||
                        files[i].type.startsWith("video/")
                    )
                        if (!fileName.endsWith(".swf")) continue;

                    if (fileName.endsWith(".swf")) {
                        cover = "assets/ruffle.svg";
                    }

                    const customCover = fileName.split(".")[0] + ".png";
                    if (
                        Array.from(files).some(
                            (file) => file.name === customCover,
                        )
                    )
                        cover = "/games/" + customCover;

                    const img = document.createElement("img");
                    img.src = cover;
                    game.appendChild(img);

                    list.appendChild(game);
                }
            }

            async function getGame(element) {
                const embedded = document.getElementById("embedded");
                embedded.src = "games/" + element.title;
                if (!element.title.includes(".")) {
                    const files = (
                        await (await fetch("/games/" + element.title)).json()
                    ).filter(
                        (key) =>
                            key.name.endsWith(".swf") ||
                            key.name.endsWith(".html"),
                    );
                    embedded.src =
                        "games/" + element.title + "/" + files[0].name;
                }

                const oldRuffle = document.getElementById("flash");
                if (oldRuffle) oldRuffle.remove();
                if (element.title.endsWith(".swf")) {
                    const newRuffle = document.createElement("script");
                    newRuffle.id = "flash";
                    newRuffle.src = "ruffle/ruffle.js";

                    document.body.appendChild(newRuffle);
                }
                const newEmbedded = document.createElement("embed");
                newEmbedded.id = "embedded";
                newEmbedded.src = embedded.src;
                embedded.replaceWith(newEmbedded);
            }

            window.RufflePlayer = window.RufflePlayer || {};
            window.RufflePlayer.config = {
                ...window.RufflePlayer.config,

                publicPath: "http://localhost:8000/ruffle/",
            };
            loadGames();
        </script>
        <script>
            const modal = document.getElementById("modal");

            function openModal() {
                modal.style.display = "block";
            }

            window.onclick = function (event) {
                if (event.target == modal) {
                    modal.style.display = "none";
                }
            };
        </script>
        <script id="flash" src=""></script>
    </body>
</html>
